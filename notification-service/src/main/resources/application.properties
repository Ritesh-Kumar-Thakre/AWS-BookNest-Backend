spring.application.name=notification-service
spring.main.allow-bean-definition-overriding=true

# =========================
# Server
server.port=${PORT:8088}

# =========================
# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/booknest_notification?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=5

# =========================
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# =========================================
# Eureka (set EUREKA_ENABLED=false for standalone deployment)
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ========
# Jwt
jwt.secret=${JWT_SECRET:MySuperSecure256BitSecretKeyForJwtSigning123456789}
jwt.expiration=86400000

# ========
# Internal Gateway Security
internal.security.secret=${INTERNAL_SECURITY_SECRET:BookNest_Internal_Secret_2024}

# ========
# Email (Gmail SMTP — port 465 + SSL for cloud deployment)
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:true}
spring.mail.host=smtp.gmail.com
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ========
# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:${RABBITMQ_USER:/}}

# ========
# Actuator
management.endpoints.web.exposure.include=health,info

# =========================
# Swagger / SpringDoc
# =========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
