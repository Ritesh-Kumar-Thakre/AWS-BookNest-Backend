spring.application.name=auth-service
spring.main.allow-bean-definition-overriding=true

# =========================
# Server
# =========================
server.port=${PORT:8081}

# =========================
# Database
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/booknest_auth?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=5

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update

# =========================================
# Eureka
# =========================================
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ========
# Jwt
# ========
jwt.secret=${JWT_SECRET:MySuperSecure256BitSecretKeyForJwtSigning123456789}
jwt.expiration=86400000

# ========
# Internal Gateway Security
internal.security.secret=${INTERNAL_SECURITY_SECRET:BookNest_Internal_Secret_2024}

# ========
# Actuator
# ========
management.endpoints.web.exposure.include=health,info

# ========
# File Upload
# ========
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${APP_UPLOAD_DIR:uploads/profiles}

# ========
# Google OAuth2
# ========
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}

# =========================
# Swagger / SpringDoc
# =========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
