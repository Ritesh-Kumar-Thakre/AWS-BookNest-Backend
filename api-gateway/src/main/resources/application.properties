spring.cloud.gateway.routes[15].id=notification-service-swagger
spring.cloud.gateway.routes[15].uri=${ROUTE_NOTIFICATION_SERVICE:lb://notification-service}
spring.cloud.gateway.routes[15].predicates[0]=Path=/notification-service/v3/api-docs/**
spring.cloud.gateway.routes[15].filters[0]=StripPrefix=1

# Centralized Swagger UI Aggregation
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Book Service
springdoc.swagger-ui.urls[1].url=/book-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Cart Service
springdoc.swagger-ui.urls[2].url=/cart-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=Order Service
springdoc.swagger-ui.urls[3].url=/order-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=Wallet Service
springdoc.swagger-ui.urls[4].url=/wallet-service/v3/api-docs
springdoc.swagger-ui.urls[5].name=Review Service
springdoc.swagger-ui.urls[5].url=/review-service/v3/api-docs
springdoc.swagger-ui.urls[6].name=Wishlist Service
springdoc.swagger-ui.urls[6].url=/wishlist-service/v3/api-docs
springdoc.swagger-ui.urls[7].name=Notification Service
springdoc.swagger-ui.urls[7].url=/notification-service/v3/api-docs

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info

# =========================
# File Upload Size
# =========================
spring.codec.max-in-memory-size=20MB
spring.cloud.gateway.httpclient.response-timeout=30s

# =========================
# CORS — Managed by CorsConfig.java (do NOT duplicate here)
# =========================
# CORS is configured in CorsConfig.java with support for multiple origins.
# Do not add spring.cloud.gateway.globalcors.* properties here to avoid conflicts.
