spring.application.name=api-gateway
server.port=${PORT:8080}

# =========================
# Eureka (set EUREKA_ENABLED=false when deploying across platforms)
# =========================
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET:MySuperSecure256BitSecretKeyForJwtSigning123456789}

# =========================
# Internal Gateway Security
# =========================
internal.security.secret=${INTERNAL_SECURITY_SECRET:BookNest_Internal_Secret_2024}

# =========================
# Gateway Routes
# =========================
# For local/Docker: uses lb://service-name (Eureka discovery)
# For multi-platform: override with direct URL env var, e.g.
#   ROUTE_AUTH_SERVICE=https://booknest-auth.onrender.com

# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${ROUTE_AUTH_SERVICE:lb://auth-service}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2

# Book Service
spring.cloud.gateway.routes[1].id=book-service
spring.cloud.gateway.routes[1].uri=${ROUTE_BOOK_SERVICE:lb://book-service}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/books/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2

# Cart Service
spring.cloud.gateway.routes[2].id=cart-service
spring.cloud.gateway.routes[2].uri=${ROUTE_CART_SERVICE:lb://cart-service}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/cart/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=2

# Order Service
spring.cloud.gateway.routes[3].id=order-service
spring.cloud.gateway.routes[3].uri=${ROUTE_ORDER_SERVICE:lb://order-service}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/orders/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=2

# Wallet Service
spring.cloud.gateway.routes[4].id=wallet-service
spring.cloud.gateway.routes[4].uri=${ROUTE_WALLET_SERVICE:lb://wallet-service}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/wallet/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=2

# Review Service
spring.cloud.gateway.routes[5].id=review-service
spring.cloud.gateway.routes[5].uri=${ROUTE_REVIEW_SERVICE:lb://review-service}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/reviews/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=2

# Wishlist Service
spring.cloud.gateway.routes[6].id=wishlist-service
spring.cloud.gateway.routes[6].uri=${ROUTE_WISHLIST_SERVICE:lb://wishlist-service}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/wishlist/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=2

# Notification Service
spring.cloud.gateway.routes[7].id=notification-service
spring.cloud.gateway.routes[7].uri=${ROUTE_NOTIFICATION_SERVICE:lb://notification-service}
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=2

# =========================
# Swagger Routes (per service)
# =========================

# Auth Service Swagger
spring.cloud.gateway.routes[8].id=auth-service-swagger
spring.cloud.gateway.routes[8].uri=${ROUTE_AUTH_SERVICE:lb://auth-service}
spring.cloud.gateway.routes[8].predicates[0]=Path=/auth-service/v3/api-docs/**
spring.cloud.gateway.routes[8].filters[0]=StripPrefix=1

# Book Service Swagger
spring.cloud.gateway.routes[9].id=book-service-swagger
spring.cloud.gateway.routes[9].uri=${ROUTE_BOOK_SERVICE:lb://book-service}
spring.cloud.gateway.routes[9].predicates[0]=Path=/book-service/v3/api-docs/**
spring.cloud.gateway.routes[9].filters[0]=StripPrefix=1

# Cart Service Swagger
spring.cloud.gateway.routes[10].id=cart-service-swagger
spring.cloud.gateway.routes[10].uri=${ROUTE_CART_SERVICE:lb://cart-service}
spring.cloud.gateway.routes[10].predicates[0]=Path=/cart-service/v3/api-docs/**
spring.cloud.gateway.routes[10].filters[0]=StripPrefix=1

# Order Service Swagger
spring.cloud.gateway.routes[11].id=order-service-swagger
spring.cloud.gateway.routes[11].uri=${ROUTE_ORDER_SERVICE:lb://order-service}
spring.cloud.gateway.routes[11].predicates[0]=Path=/order-service/v3/api-docs/**
spring.cloud.gateway.routes[11].filters[0]=StripPrefix=1

# Wallet Service Swagger
spring.cloud.gateway.routes[12].id=wallet-service-swagger
spring.cloud.gateway.routes[12].uri=${ROUTE_WALLET_SERVICE:lb://wallet-service}
spring.cloud.gateway.routes[12].predicates[0]=Path=/wallet-service/v3/api-docs/**
spring.cloud.gateway.routes[12].filters[0]=StripPrefix=1

# Review Service Swagger
spring.cloud.gateway.routes[13].id=review-service-swagger
spring.cloud.gateway.routes[13].uri=${ROUTE_REVIEW_SERVICE:lb://review-service}
spring.cloud.gateway.routes[13].predicates[0]=Path=/review-service/v3/api-docs/**
spring.cloud.gateway.routes[13].filters[0]=StripPrefix=1

# Wishlist Service Swagger
spring.cloud.gateway.routes[14].id=wishlist-service-swagger
spring.cloud.gateway.routes[14].uri=${ROUTE_WISHLIST_SERVICE:lb://wishlist-service}
spring.cloud.gateway.routes[14].predicates[0]=Path=/wishlist-service/v3/api-docs/**
